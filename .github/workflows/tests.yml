name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            dependencies: latest
          - php: '8.3'
            dependencies: latest
          - php: '8.4'
            dependencies: latest
          - php: '8.5'
            dependencies: latest
          - php: '8.4'
            dependencies: guzzle7
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl, mbstring, dom, xml, xmlwriter, tokenizer
          coverage: none
          tools: composer:2.10.3

      - name: Setup Python for offline workflow probes
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Get Composer download cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-2.10.3-php${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}

      - name: Resolve and audit dependencies
        env:
          DEPENDENCY_SET: ${{ matrix.dependencies }}
        run: |
          set -euo pipefail
          php --version
          composer --version
          composer validate --strict --no-scripts --no-plugins
          case "$DEPENDENCY_SET" in
            latest) composer update --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins ;;
            guzzle7) composer update --with='guzzlehttp/guzzle:^7.8' --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins ;;
            *) echo 'Unknown dependency lane' >&2; exit 1 ;;
          esac
          composer validate --strict --no-scripts --no-plugins
          composer check-platform-reqs --no-scripts --no-plugins
          composer audit --format=json --no-scripts --no-plugins
          composer audit --no-dev --format=json --no-scripts --no-plugins
          composer show --format=json --no-scripts --no-plugins
          composer outdated --locked --all --format=json --no-scripts --no-plugins
          sha256sum composer.lock
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $guzzle = Composer\InstalledVersions::getVersion('guzzlehttp/guzzle');
          $phpunit = Composer\InstalledVersions::getVersion('phpunit/phpunit');
          $expectedGuzzle = getenv('DEPENDENCY_SET') === 'guzzle7' ? 7 : 8;
          $expectedPhpunit = PHP_VERSION_ID >= 80401 ? 13 : (PHP_VERSION_ID >= 80300 ? 12 : 11);
          if ((int) $guzzle !== $expectedGuzzle || (int) $phpunit !== $expectedPhpunit) {
              throw new RuntimeException('Resolved major versions do not match the runtime/lane contract');
          }
          printf("Effective PHP=%s Guzzle=%s PHPUnit=%s\n", PHP_VERSION, $guzzle, $phpunit);
          PHP

      - name: Run strict tests and quality checks without external networking
        env:
          QA_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          [[ "$QA_PYTHON" = /* && -x "$QA_PYTHON" ]]
          # GitHub-hosted Ubuntu allows passwordless sudo. Fail closed if isolation fails.
          timeout --signal=TERM --kill-after=10s 600 sudo --non-interactive \
            unshare --net --mount --pid --fork --mount-proc \
            env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            bash -s -- "$PWD" "$(id -u)" "$(id -g)" "$QA_PYTHON" <<'ISOLATED'
          set -euo pipefail
          repository=$1
          qa_uid=$2
          qa_gid=$3
          qa_python=$4
          mount --make-rprivate /
          mount --bind "$repository" /mnt
          mount -t tmpfs -o mode=1777 tmpfs /tmp
          mount -t tmpfs -o mode=755 tmpfs /home
          mount -t tmpfs -o mode=755 tmpfs /run
          mount -t tmpfs -o mode=755 tmpfs /var
          ip link set lo up
          ip -j address show
          ip -j route show table all
          install -d -m 700 -o "$qa_uid" -g "$qa_gid" /tmp/withallo-home
          cd /mnt
          setpriv --reuid="$qa_uid" --regid="$qa_gid" --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
            env -i PATH=/usr/bin:/bin HOME=/tmp/withallo-home TMPDIR=/tmp \
            XDG_CONFIG_HOME=/tmp/withallo-home/config XDG_CACHE_HOME=/tmp/withallo-home/cache \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 APP_ENV=testing QA_PYTHON="$qa_python" bash -s <<'CHECKS'
          set -euo pipefail
          ulimit -c 0
          ulimit -v 1048576
          ulimit -t 120
          "$QA_PYTHON" -I -B tests/workflow_probes.py
          run_check() {
            label=$1
            shift
            timeout --signal=TERM --kill-after=5s 120 strace -f -e trace=network -s 0 \
              -o "/tmp/withallo-home/$label.network" "$@"
          }
          run_check phpunit php -d memory_limit=512M vendor/bin/phpunit \
            --fail-on-empty-test-suite --fail-on-phpunit-deprecation \
            --display-phpunit-deprecations --display-warnings \
            --log-junit /tmp/withallo-home/junit.xml
          php <<'PHP'
          <?php
          $xml = simplexml_load_file('/tmp/withallo-home/junit.xml');
          $suite = $xml->testsuite;
          if ((int) $suite['tests'] < 36 || (int) $suite['failures'] !== 0
              || (int) $suite['errors'] !== 0 || (int) $suite['skipped'] !== 0) {
              throw new RuntimeException('Expected at least 36 executed tests and no failures/errors/skips');
          }
          printf("Executed %d tests / %d assertions\n", (int) $suite['tests'], (int) $suite['assertions']);
          PHP
          run_check phpstan php -d memory_limit=512M vendor/bin/phpstan analyse --debug --no-progress --memory-limit=512M
          run_check test-phpstan php -d memory_limit=512M vendor/bin/phpstan analyse --debug --no-progress --memory-limit=512M tests/HttpClientTest.php
          run_check pint php -d memory_limit=512M vendor/bin/pint --test
          php <<'PHP'
          <?php
          // A completed missing pathname IPC endpoint carries no application payload.
          // Authorize only this full record; diagnostic projections never authorize calls.
          function isMissingLocalIpcConnect(string $line): bool
          {
              if (str_contains($line, '<unfinished ...>') || str_contains($line, '<... ')) {
                  return false;
              }
              $pattern = <<<'LOCALIPC'
          ~\A[ \t]*(?:(?<pid>[1-9][0-9]{0,9})[ \t]+)?connect\((?<fd>0|[1-9][0-9]{0,9}),[ \t]*\{sa_family=AF_UNIX,[ \t]*sun_path="(?<path>[^"\\\x00-\x1f\x7f]{1,107})"\},[ \t]*(?<length>[1-9][0-9]{0,2})\)[ \t]*=[ \t]*-1 ENOENT \(No such file or directory\)[ \t]*\z~
          LOCALIPC;
              if (preg_match($pattern, $line, $record) !== 1) {
                  return false;
              }
              return (int) $record['fd'] <= 2147483647
                  && ($record['pid'] === '' || (int) $record['pid'] <= 2147483647)
                  && (int) $record['length'] >= 3 && (int) $record['length'] <= 110
                  && strlen($record['path']) <= 107;
          }
          $blocked = false;
          $allowedLocalIpc = 0;
          $matchedLines = 0;
          $diagnosticLimit = 20;
          $knownLabels = ['phpunit', 'phpstan', 'test-phpstan', 'pint'];
          $knownFamilies = ['AF_INET', 'AF_INET6', 'AF_UNIX', 'AF_NETLINK'];
          $knownErrors = ['EACCES', 'EPERM', 'ENOENT', 'ECONNREFUSED', 'ENETUNREACH',
              'EHOSTUNREACH', 'EAFNOSUPPORT', 'EAGAIN', 'EINPROGRESS', 'EBADF',
              'EINVAL', 'ENOTSOCK', 'EADDRNOTAVAIL', 'EPIPE', 'ECONNRESET',
              'ETIMEDOUT', 'EPROTONOSUPPORT', 'ENOBUFS', 'ENOMEM', 'EISCONN', 'EINTR'];
          foreach (glob('/tmp/withallo-home/*.network') as $trace) {
              $label = pathinfo($trace, PATHINFO_FILENAME);
              $tool = in_array($label, $knownLabels, true) ? $label : 'unknown';
              foreach (file($trace, FILE_IGNORE_NEW_LINES) as $line) {
                  if (!preg_match('/\b(connect|sendto|sendmsg)(?:\(|\s+resumed>)/', $line, $call)) {
                      continue;
                  }
                  if (isMissingLocalIpcConnect($line)) {
                      ++$allowedLocalIpc;
                      continue;
                  }
                  $blocked = true;
                  ++$matchedLines;
                  if ($matchedLines > $diagnosticLimit) {
                      continue;
                  }
                  // Project typed fields only: never emit arguments, paths or raw trace lines.
                  $family = 'unknown';
                  if (preg_match('/\b(AF_[A-Z0-9_]+)\b/', $line, $address)
                      && in_array($address[1], $knownFamilies, true)) {
                      $family = $address[1];
                  }
                  $result = 'unknown';
                  $errno = 'unknown';
                  if (preg_match('/\)\s+=\s+(-?[0-9]{1,9})(?:\s+([A-Z][A-Z0-9_]*))?(?:\s|$)/', $line, $returned)) {
                      $result = (int) $returned[1];
                      if (isset($returned[2]) && in_array($returned[2], $knownErrors, true)) {
                          $errno = $returned[2];
                      }
                  }
                  echo json_encode(['tool' => $tool, 'syscall' => $call[1],
                      'family' => $family, 'return' => $result, 'errno' => $errno], JSON_THROW_ON_ERROR), "\n";
              }
          }
          if ($allowedLocalIpc > 0) {
              echo json_encode(['allowed_missing_local_ipc_connects' => $allowedLocalIpc], JSON_THROW_ON_ERROR), "\n";
          }
          if ($blocked) {
              echo json_encode(['network_diagnostic_omitted' => max(0, $matchedLines - $diagnosticLimit)], JSON_THROW_ON_ERROR), "\n";
              throw new RuntimeException('Unexpected network attempt during isolated quality checks');
          }
          echo $allowedLocalIpc > 0
              ? "No prohibited connect/sendto/sendmsg calls during isolated quality checks\n"
              : "No connect/sendto/sendmsg calls during isolated quality checks\n";
          PHP
          CHECKS
          ISOLATED
