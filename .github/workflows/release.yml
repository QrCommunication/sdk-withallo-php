# =============================================================================
# Withallo SDK (PHP) - Release Workflow
# =============================================================================
# Triggered by pushing a tag v* (e.g. v0.1.0).
# Runs full tests + static analysis, then creates a GitHub Release with notes
# extracted from CHANGELOG.md.
#
# Packagist is synced via the GitHub -> Packagist webhook (configured in the
# repo's Settings -> Webhooks). No publish step is needed here.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Full test + static analysis pass before the release
  # ---------------------------------------------------------------------------
  test:
    name: Pre-release Tests
    runs-on: [self-hosted, linux, x64, hetzner, qrcom]
    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl, xml
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run PHPStan
        run: composer analyse

      - name: Run PHPUnit
        run: composer test

  # ---------------------------------------------------------------------------
  # GitHub Release with notes extracted from CHANGELOG.md
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: [self-hosted, linux, x64, hetzner, qrcom]
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          GH_REF: ${{ github.ref }}
        run: |
          VERSION="${GH_REF#refs/tags/v}"
          TAG="${GH_REF#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(awk "/^## \[$RELEASE_VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $RELEASE_VERSION"
          fi
          echo "$NOTES" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Withallo SDK PHP v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Release v$RELEASE_VERSION created"
            echo ""
            echo "- GitHub Release created automatically"
            echo "- Packagist will sync via the GitHub webhook"
            echo "- Check: https://packagist.org/packages/qrcommunication/withallo-sdk"
          } >> "$GITHUB_STEP_SUMMARY"
