name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: php
          package-name: qrcommunication/withallo-sdk

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      # Packagist auto-syncs via the GitHub Service Hook configured at the repo level.
      # This optional step lets you force-push the new version via the Packagist API
      # if the webhook is not configured. Requires secrets PACKAGIST_USER + PACKAGIST_TOKEN.
      - name: Notify Packagist (optional)
        if: ${{ steps.release.outputs.release_created }}
        env:
          PACKAGIST_USER: ${{ secrets.PACKAGIST_USER }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -n "$PACKAGIST_USER" ] && [ -n "$PACKAGIST_TOKEN" ]; then
            curl -fsSL -XPOST \
              -H 'content-type:application/json' \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USER}&apiToken=${PACKAGIST_TOKEN}" \
              -d '{"repository":{"url":"https://github.com/QrCommunication/sdk-withallo-php"}}'
          else
            echo "Packagist credentials not set — relying on GitHub webhook for sync."
          fi
